<body>
  <style>
    #global-back-fallback {
      position: fixed;
      left: 1rem;
      bottom: 1rem;
      z-index: 2147483647;
      min-height: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.88);
      color: #f7f2e8;
      padding: 0.55rem 0.9rem;
      font: 700 0.78rem/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      cursor: pointer;
    }

    #global-back-fallback:hover {
      background: rgba(28, 28, 28, 0.95);
    }

    @media (max-width: 1023px) {
      #global-back-fallback {
        bottom: calc(4.75rem + env(safe-area-inset-bottom));
      }
    }
  </style>
  <button id="global-back-fallback" type="button" aria-label="Go back">&larr; BACK</button>
  <div id="root"></div>
  <script>
    if (window.location.pathname === '/login' || window.location.pathname === '/signin') {
      window.history.replaceState(null, '', '/auth' + window.location.search + window.location.hash);
    }

    document.getElementById('global-back-fallback')?.addEventListener('click', () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.assign('/');
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').catch(err => {
          console.error('Service worker registration failed:', err);
        });
      });
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
